<title>Панель мероприятий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Раскладка: слева бриф нового мероприятия, справа лента мероприятий со стадиями; на телефоне — одна колонка */
:root {
  --bg: #f5f1f1;
  --surface: #ffffff;
  --fg: #22171a;
  --muted: #6e5f62;
  --line: #e4d9da;
  --accent: #b3202a;
  --accent-fg: #ffffff;
  --accent-soft: #f6dfe0;
  --ok: #1f7a4a;
  --ok-soft: #dcefe4;
  --wait: #9a6a00;
  --wait-soft: #f6ebcf;
  --idle-soft: #eee8e9;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161012; --surface: #211a1c; --fg: #f3eaeb; --muted: #ae9c9f; --line: #3a2e31;
    --accent: #e0525a; --accent-fg: #1a0e10; --accent-soft: #42222a;
    --ok: #6fd39c; --ok-soft: #1d3428; --wait: #e8bf5d; --wait-soft: #3a3020; --idle-soft: #2d2427;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161012; --surface: #211a1c; --fg: #f3eaeb; --muted: #ae9c9f; --line: #3a2e31;
  --accent: #e0525a; --accent-fg: #1a0e10; --accent-soft: #42222a;
  --ok: #6fd39c; --ok-soft: #1d3428; --wait: #e8bf5d; --wait-soft: #3a3020; --idle-soft: #2d2427;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 28px 48px;
}
.wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: 28px; }

header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.barrel {
  flex: none; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg);
  font: 700 18px/1 var(--font-display);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.18);
}
header h1 { margin: 0; font: 700 clamp(22px, 4vw, 30px)/1.15 var(--font-display); text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--muted); max-width: 60ch; }

.cols { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

h2 { margin: 0 0 14px; font: 600 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

form {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; display: grid; gap: 14px;
}
.field { display: grid; gap: 6px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { font-weight: 500; font-size: 14px; }
.hint { color: var(--muted); font-size: 12.5px; }
input {
  width: 100%; min-width: 0; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 12px;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--accent); }
button {
  font: 600 15px/1 var(--font-body); cursor: pointer;
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 10px; padding: 13px 16px;
}
button:disabled { opacity: .55; cursor: default; }
.msg { min-height: 1.3em; font-size: 13.5px; margin: 0; }
.msg.err { color: var(--accent); }
.msg.ok { color: var(--ok); }

.list { display: grid; gap: 12px; }
.event {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
}
.date { text-align: center; border-right: 1px solid var(--line); padding-right: 14px; align-self: start; }
.date b { display: block; font: 700 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.date span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.event h3 { margin: 0; font: 600 18px/1.3 var(--font-body); text-wrap: balance; overflow-wrap: anywhere; }
.meta { margin: 2px 0 10px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
  background: var(--idle-soft); color: var(--muted);
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.review { background: var(--wait-soft); color: var(--wait); }
.chip.approved, .chip.ready { background: var(--ok-soft); color: var(--ok); }
.chip.progress { background: var(--accent-soft); color: var(--accent); }

.empty, .notice {
  border: 1px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted);
}
.empty strong, .notice strong { color: var(--fg); display: block; margin-bottom: 4px; }

@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .event { animation: in .25s ease-out; } }
@keyframes in { from { transform: translateY(4px); } to { transform: none; } }
</style>

<div class="wrap">
  <header>
    <div class="barrel" aria-hidden="true">90</div>
    <div>
      <h1>Панель мероприятий</h1>
      <p>Музыкальное лото: заполните бриф — по нему соберутся список из 90 песен, бланки участников и презентация.</p>
    </div>
  </header>

  <div class="cols">
    <section aria-labelledby="form-title">
      <h2 id="form-title">Новый бриф</h2>
      <form id="brief" novalidate>
        <div class="field">
          <label for="theme">Тема</label>
          <input id="theme" name="theme" required maxlength="120" placeholder="Например, 8 марта или Хиты 2000-х">
        </div>
        <div class="row">
          <div class="field">
            <label for="date">Дата</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div class="field">
            <label for="time">Время</label>
            <input id="time" name="time" type="time" required>
          </div>
        </div>
        <div class="field">
          <label for="place">Место</label>
          <input id="place" name="place" required maxlength="160" placeholder="Заведение и адрес">
        </div>
        <div class="row">
          <div class="field">
            <label for="n_individual">Индивидуальных бланков</label>
            <input id="n_individual" name="n_individual" type="number" min="0" max="500" step="1" value="90" required>
          </div>
          <div class="field">
            <label for="n_team">Командных бланков</label>
            <input id="n_team" name="n_team" type="number" min="0" max="500" step="1" value="35" required>
          </div>
        </div>
        <button id="submit" type="submit">Отправить бриф</button>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Мероприятия</h2>
      <div id="list" class="list">
        <div class="empty">
          <strong>Мероприятий пока нет</strong>
          Отправьте первый бриф — мероприятие появится здесь со статусом каждой стадии: список песен, бланки, презентация.
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const STAGES = [
  ["songs", "Список песен"],
  ["blanks", "Бланки"],
  ["presentation", "Презентация"],
];
const STATE = {
  draft: ["", "не начато"],
  in_progress: ["progress", "в работе"],
  review: ["review", "на утверждении"],
  approved: ["approved", "утверждено"],
  ready: ["ready", "готово"],
};
const MONTHS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

const form = document.getElementById("brief");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submit");
const list = document.getElementById("list");
let db = null;

function say(text, kind) {
  msg.textContent = text;
  msg.className = "msg" + (kind ? " " + kind : "");
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderEvent(data) {
  const card = el("article", "event");
  const date = el("div", "date");
  const [y, m, d] = String(data.date || "").split("-");
  date.append(el("b", null, d ? String(+d) : "—"), el("span", null, m ? MONTHS[+m - 1] + " " + y : ""));

  const body = el("div");
  body.style.minWidth = "0";
  body.append(el("h3", null, data.theme || "Без темы"));
  const meta = [data.time, data.place].filter(Boolean).join(" · ");
  const blanks = data.n_individual == null && data.n_team == null
    ? "число бланков не указано"
    : `бланков: ${data.n_individual ?? 0} инд. + ${data.n_team ?? 0} команд.`;
  body.append(el("p", "meta", meta ? meta + " · " + blanks : blanks));

  const stages = el("div", "stages");
  const st = data.stages || {};
  for (const [key, title] of STAGES) {
    const [cls, label] = STATE[st[key]] || STATE.draft;
    stages.append(el("span", "chip " + cls, `${title}: ${label}`));
  }
  body.append(stages);
  card.append(date, body);
  return card;
}

function renderList(snap) {
  if (snap.empty) {
    list.replaceChildren(list.firstElementChild?.classList.contains("empty") ? list.firstElementChild : emptyState());
    return;
  }
  list.replaceChildren(...snap.docs.map(d => renderEvent(d.data())));
}

function emptyState() {
  const box = el("div", "empty");
  box.append(el("strong", null, "Мероприятий пока нет"),
    document.createTextNode("Отправьте первый бриф — мероприятие появится здесь со статусом каждой стадии: список песен, бланки, презентация."));
  return box;
}

function notice(title, text) {
  const box = el("div", "notice");
  box.append(el("strong", null, title), document.createTextNode(text));
  return box;
}

function readForm() {
  const f = form.elements;
  let firstBad = null;
  for (const input of form.querySelectorAll("input")) {
    const v = input.value.trim();
    const bad = !v || (input.type === "number" && (!Number.isInteger(+v) || +v < 0 || +v > 500));
    input.setAttribute("aria-invalid", bad ? "true" : "false");
    if (bad && !firstBad) firstBad = input;
  }
  if (firstBad) {
    firstBad.focus();
    return null;
  }
  return {
    theme: f.theme.value.trim(),
    date: f.date.value,
    time: f.time.value,
    place: f.place.value.trim(),
    n_individual: +f.n_individual.value,
    n_team: +f.n_team.value,
    status: "draft",
    stages: { songs: "draft", blanks: "draft", presentation: "draft" },
    created_at: new Date().toISOString(),
  };
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = readForm();
  if (!data) { say("Заполните все поля. Число бланков — целое, от 0 до 500.", "err"); return; }
  if (!db) { say("Сохранение недоступно: откройте панель, войдя в свой аккаунт Claude.", "err"); return; }
  submitBtn.disabled = true;
  say("Сохраняю…");
  try {
    await db.collection("events").add(data);
    form.reset();
    form.elements.n_individual.value = 90;
    form.elements.n_team.value = 35;
    say(`Бриф «${data.theme}» сохранён. Подбор песен начнётся в рабочей сессии.`, "ok");
  } catch (err) {
    say(err && err.code === "invalid_argument"
      ? "У вас нет права добавлять мероприятия в эту панель."
      : "Не получилось сохранить. Проверьте интернет и отправьте ещё раз.", "err");
  } finally {
    submitBtn.disabled = false;
  }
});

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) {
    list.replaceChildren(notice("Список недоступен", "Откройте панель в Claude под своим аккаунтом — здесь появятся мероприятия и их стадии."));
    return;
  }
  db.collection("events").orderBy("date").onSnapshot(renderList, () => {
    list.replaceChildren(notice("Список не загрузился", "Обновите страницу через минуту."));
  });
})();
</script>
